{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block title %}编辑评论 - 我的博客{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-6 col-md-offset-3">
            <h2>编辑评论</h2>
            <p class="text-muted">文章：{{ comment.post.title }}</p>
            
            {{ wtf.quick_form(form, button_map={'submit': 'primary'}) }}
            
            <div style="margin-top: 20px;">
                <a href="{{ url_for('post_detail', post_id=comment.post_id) }}" 
                   class="btn btn-default">取消</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
